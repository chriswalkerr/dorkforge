[package]
name = "dorkforge"
version = "1.3.0"
edition = "2021"
authors = ["DorkForge Contributors"]
description = "Deterministic local OSINT dork generator in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
sha2 = "0.11.1"
clap_complete = "4.6.11"

[dev-dependencies]
tempfile = "3.16"

[[bin]]
name = "dorkforge"
path = "src/main.rs"

[lib]
name = "dorkforge"
path = "src/lib.rs"
