"inurl:" = { documentation_status = "unknown", test_status = "untested", description = "URL-term restriction; not listed in Brave's current official operator help." }
"filetype:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to a file type." }
"ext:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to a file extension." }
"intitle:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to terms in page titles." }
"inbody:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to terms in page bodies." }
"inpage:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to terms in page titles or bodies." }
"loc:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to a country or region code." }
"lang:" = { documentation_status = "experimental", test_status = "untested", description = "Restricts results to a language code." }
"OR" = { documentation_status = "experimental", test_status = "untested", description = "Matches either side of a Boolean alternative." }
"AND" = { documentation_status = "experimental", test_status = "untested", description = "Requires all specified terms or conditions." }
"NOT" = { documentation_status = "experimental", test_status = "untested", description = "Excludes results matching the following condition." }
"-" = { documentation_status = "experimental", test_status = "untested", description = "Excludes results containing the following term." }
"+" = { documentation_status = "experimental", test_status = "untested", description = "Promotes results containing the following term." }
"\"" = { documentation_status = "experimental", test_status = "untested", description = "Requests an exact phrase." }

[[providers]]
id = "duckduckgo"
name = "DuckDuckGo"
enabled = true
supported_operators = ["site:", "filetype:", "inurl:", "intitle:", "-", "+", "\""]
supported_categories = ["exact_match", "mentions", "documents", "public_profiles", "forums", "code_repositories", "domain_pages", "subdomains", "archives", "public_records", "company_records", "security_reports", "technology_fingerprint", "marketplaces", "custom"]
