"filetype:" = { documentation_status = "documented", test_status = "untested", description = "Restricts results to the documented file types." }
"inurl:" = { documentation_status = "documented", test_status = "untested", description = "Restricts results to terms in page URLs." }
"intitle:" = { documentation_status = "documented", test_status = "untested", description = "Restricts results to terms in page titles." }
"inbody:" = { documentation_status = "unknown", test_status = "untested", description = "Body-text restriction; not listed in DuckDuckGo's current official syntax help." }
"OR" = { documentation_status = "unknown", test_status = "untested", description = "Explicit OR token; not listed in DuckDuckGo's current official syntax help." }
"AND" = { documentation_status = "unknown", test_status = "untested", description = "Explicit AND token; not listed in DuckDuckGo's current official syntax help." }
"-" = { documentation_status = "documented", test_status = "untested", description = "Reduces results containing the following term." }
"+" = { documentation_status = "documented", test_status = "untested", description = "Promotes results containing the following term." }
