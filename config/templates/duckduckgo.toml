# DuckDuckGo Search Templates (revised)
# Documented: site, -site, filetype (pdf, doc(x), xls(x), ppt(x), html only), intitle, inurl, quotes, +/-
# NOT supported: inbody, OR/parentheses -> no mention templates; OR groups split into separate queries
# DDG itself says some syntax does not work 100% reliably
# Optional keys (need parser support): note = "", validation = "untested"
# Categories: blockchain_explorers, code_repositories, company_records, documents, domain_pages, exact_match, forums, indexed_pages, marketplaces, mentions, profiles, public_records, security_reports, subdomain_heuristics, technology_fingerprint

# --- EMAIL ---
[[template]]
id = "ddg_email_exact"
enabled = true
identifier_type = "email"
category = "exact_match"
providers = ["duckduckgo"]
template = '"{value}"'
tags = ["email", "exact", "baseline"]
validation = "untested"

[[template]]
id = "ddg_email_pdf"
enabled = true
identifier_type = "email"
category = "documents"
providers = ["duckduckgo"]
template = '"{value}" filetype:pdf'
tags = ["email", "documents"]
validation = "untested"
note = "DDG: filetype limited to pdf/doc(x)/xls(x)/ppt(x)/html, no OR; one query per file family"

[[template]]
id = "ddg_email_sheets"
enabled = true
identifier_type = "email"
category = "documents"
providers = ["duckduckgo"]
