# Yandex Search Templates (revised)
# Documented: site (incl. subdomains), host (main host only), url, inurl, title, mime (pdf, xls, ods, rtf, ppt, odp, swf, odt, odg, doc), lang, quotes, +, -, | (OR), parentheses
# Not available: intext/inbody, filetype, ip. Old '~~' for exclusion removed (it is a word-level operator, not for site:)
# Optional keys (need parser support): note = "", validation = "untested"
# Categories: blockchain_explorers, code_repositories, company_records, documents, domain_pages, exact_match, forums, indexed_pages, marketplaces, mentions, profiles, public_records, security_reports, subdomain_heuristics, technology_fingerprint

# --- EMAIL ---
[[template]]
id = "yandex_email_exact"
enabled = true
identifier_type = "email"
category = "exact_match"
providers = ["yandex"]
template = '"{value}"'
tags = ["email", "exact", "baseline"]
validation = "untested"

[[template]]
id = "yandex_email_pdf"
enabled = true
identifier_type = "email"
category = "documents"
providers = ["yandex"]
template = '"{value}" mime:pdf'
tags = ["email", "documents"]
validation = "untested"
note = "Yandex mime: types: pdf, xls, ods, rtf, ppt, odp, swf, odt, odg, doc (docx->doc, xlsx->xls); OR is |; csv/txt/log/conf not supported"

[[template]]
