# Brave Search Templates (revised)
# Documented: site, filetype/ext, inbody, inpage, intitle, loc, lang, OR/AND/NOT (uppercase), parentheses
# Not documented: inurl -> not used. Brave labels its operators experimental
# Optional keys (need parser support): note = "", validation = "untested"
# Categories: blockchain_explorers, code_repositories, company_records, documents, domain_pages, exact_match, forums, indexed_pages, marketplaces, mentions, profiles, public_records, security_reports, subdomain_heuristics, technology_fingerprint

# --- EMAIL ---
[[template]]
id = "brave_email_exact"
enabled = true
identifier_type = "email"
category = "exact_match"
providers = ["brave"]
template = '"{value}"'
tags = ["email", "exact", "baseline"]
validation = "untested"

[[template]]
id = "brave_email_pdf"
enabled = true
identifier_type = "email"
category = "documents"
providers = ["brave"]
template = '"{value}" filetype:pdf'
tags = ["email", "documents"]
validation = "untested"

[[template]]
id = "brave_email_sheets"
enabled = true
identifier_type = "email"
category = "documents"
providers = ["brave"]
template = '"{value}" (filetype:xls OR filetype:xlsx OR filetype:csv)'
tags = ["email", "documents"]
validation = "untested"

[[template]]
id = "brave_email_mentions"
enabled = true
identifier_type = "email"
category = "mentions"
providers = ["brave"]
template = 'inbody:"{value}"'
tags = ["email", "mentions", "experimental"]
validation = "untested"
note = "inbody: is documented by Brave (operators are labelled experimental)"

[[template]]
id = "brave_email_github"
enabled = true
identifier_type = "email"
category = "code_repositories"
providers = ["brave"]
template = '"{value}" site:github.com'
tags = ["email", "github"]
validation = "untested"

[[template]]
id = "brave_email_gitlab"
enabled = true
identifier_type = "email"
category = "code_repositories"
providers = ["brave"]
template = '"{value}" site:gitlab.com'
tags = ["email", "gitlab"]
validation = "untested"

[[template]]
id = "brave_email_pastebin"
enabled = true
identifier_type = "email"
category = "code_repositories"
providers = ["brave"]
template = '"{value}" site:pastebin.com'
tags = ["email", "pastebin", "paste"]
validation = "untested"

[[template]]
id = "brave_email_linkedin"
enabled = true
identifier_type = "email"
category = "public_profiles"
providers = ["brave"]
template = '"{value}" site:linkedin.com/in'
tags = ["email", "linkedin"]
validation = "untested"

[[template]]
id = "brave_email_x"
enabled = true
identifier_type = "email"
category = "public_profiles"
providers = ["brave"]
template = '"{value}" (site:x.com OR site:twitter.com)'
tags = ["email", "profiles", "x"]
validation = "untested"
note = "x.com and twitter.com are one platform; old pages are indexed under twitter.com"

